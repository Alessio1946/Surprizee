<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surprizë ❤️</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e8,#fff0f7);
    font-family:Arial,sans-serif;
    text-align:center;
}

.box{
    background:white;
    padding:30px;
    border-radius:35px;
    width:90%;
    max-width:400px;
    box-shadow:0 0 30px #ffb6d9;
}

.dog{
    font-size:80px;
    transition:0.4s;
}

h1{
    color:#ff5c9a;
    font-size:28px;
}

.cute-text{
    color:#ff5c9a;
    font-weight:bold;
}

button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.yes{
    background:#ff5c9a;
    color:white;
    box-shadow:0 5px 15px #ffc0dc;
}

.no{
    background:#ffd6e8;
    color:#777;
}

.gift{
    display:none;
    background:#ff8fbd;
    color:white;
    padding:18px;
    margin:15px;
    border-radius:25px;
    cursor:pointer;
}

#message{
    display:none;
    color:#ff5c9a;
    line-height:1.7;
    text-align:left;
}

</style>

</head>


<body>

<div class="box">

<div class="dog" id="dog">
🐶
</div>

<h1>A e do Elushi Alessin? ❤️</h1>

<button class="yes" onclick="yes()">PO ❤️</button>

<button class="no" onclick="no()">JO 😢</button>


<h2 id="title" style="display:none;" class="cute-text">
Kam 2 surpriza për ty 🎁❤️
</h2>


<div class="gift" onclick="song()">
🎁 Surpriza 1 - Kënga jonë 🎵
</div>


<div class="gift" onclick="text()">
🎁 Surpriza 2 - Për ty ❤️
</div>


<p id="message"></p>


</div>


<script>

let size=20;
let sad=0;


function no(){

sad++;

size-=3;

document.querySelector(".no").style.fontSize=size+"px";

let dog=document.getElementById("dog");

if(sad==1){
dog.innerHTML="🥺🐶";
}

if(sad==2){
dog.innerHTML="😭🐶";
}

if(sad>=3){
dog.innerHTML="🥹🐶";
}

if(size<=5){
document.querySelector(".no").style.display="none";
}

}



function yes(){

document.querySelector(".yes").style.display="none";
document.querySelector(".no").style.display="none";

document.querySelector("h1").innerHTML=
"E dija që do thoshe PO ❤️🥹";

document.getElementById("dog").innerHTML="😍🐶";

document.getElementById("title").style.display="block";

document.querySelectorAll(".gift").forEach(function(x){
x.style.display="block";
});

}



function song(){

window.open(
"https://youtu.be/6k8cpUkKK4c?si=xQZJLDpo4Yba-MRK",
"_blank"
);

}



function text(){

document.getElementById("message").style.display="block";

document.getElementById("message").innerHTML=`

<h3>Elushi im i vogël ❤️</h3>

Kurrë nuk do ta kuptosh plotësisht dashurinë që kam për ty,
sepse ajo vetëm shtohet dita-ditës.<br><br>

Momentet më të bukura të jetës time i kam kaluar me ty.
Nga bilardo, ping pong, kinema, pishina dhe shëtitjet tona,
deri te Sunny Hill Festival, një nga ditët më të bukura të jetës time.<br><br>

Jam shumë krenar që jam i dashuri yt, Elushi im i vogël ❤️<br><br>

Kjo është vetëm fillimi i dashurisë sonë.
Jam shumë me fat që bëmë 1 vit bashkë 🥹❤️<br><br>

Me shumë dashuri,<br>
<b>ALESSIO ❤️</b>

`;

}

</script>


</body>
</html>
